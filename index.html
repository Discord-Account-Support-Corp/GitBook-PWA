<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>GitBook Workspace Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icons/icon-192.svg" sizes="192x192" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <style>
    body,html{height:100%;margin:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background-color:#ffffff;}
    .message{max-width:90%;text-align:center}
    .logo{width:64px;height:64px;margin-bottom:16px}
  </style>
</head>
<body>
  <div class="message">
    <img class="logo" src="icons/icon-192.svg" alt="GitBook">
    <h1 id="headline">PWA Transporter Connected</h1>
    <p id="subline">Tap Safari's Share icon &rarr; "Add to Home Screen" to install.</p>
  </div>

  <script>
    const target = 'https://gitbook.com';

    const isStandalone = window.navigator.standalone === true || 
                         window.matchMedia('(display-mode: standalone)').matches || 
                         window.matchMedia('(display-mode: minimal-ui)').matches;

    // The Safety Lock: If we are in the standard Safari browser, kill ALL redirects completely
    if (!isStandalone) {
      console.log("Safe Mode: Stalled inside Safari Browser to allow installation.");
    } else {
      // ONLY redirect if explicitly running from the saved Home Screen Icon
      document.getElementById('headline').textContent = "Opening GitBook…";
      
      const DEBOUNCE_MS = 300;
      let lastSlashTime = 0;

      window.addEventListener('keydown', function (e) {
        if (e.key !== '/') return;
        if (e.isComposing || e.repeat) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return;
        }
        const now = Date.now();
        if (now - lastSlashTime < DEBOUNCE_MS) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return;
        }
        lastSlashTime = now;
      }, true);

      // Execute redirect inside the standalone app wrapper wrapper
      window.open(target, '_self');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
      });
    }
  </script>
</body>
</html>
