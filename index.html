<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitBook Workspace Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #safari-prompt { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; color: #24292e; text-align: center; background: #ffffff; }
        .logo { width: 64px; height: 64px; margin-bottom: 16px; }
        .status-text { font-size: 18px; font-weight: 600; color: #24292e; margin-bottom: 4px; }
        .instruction-text { font-size: 14px; color: #586069; }
    </style>
</head>
<body>

    <div id="safari-prompt">
        <img class="logo" src="https://gitbook.com" alt="GitBook">
        <div class="status-text">PWA Transporter Connected</div>
        <div class="instruction-text">Tap Safari's Share icon &rarr; "Add to Home Screen" to install.</div>
    </div>

    <script>
        // Register the service worker quietly in the background without affecting the launch path
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
            });
        }
    </script>
</body>
</html>
