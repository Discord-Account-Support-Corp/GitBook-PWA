<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>GitBook Workspace Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icons/icon-192.svg" sizes="192x192" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    body,html{height:100%;margin:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background-color:#ffffff;}
    .message{max-width:90%;text-align:center}
    .logo{width:64px;height:64px;margin-bottom:16px}
    h1{font-size: 24px; color: #24292e; margin-bottom: 8px;}
    p{font-size: 16px; color: #586069;}
  </style>
</head>
<body>
  <div class="message">
    <img class="logo" src="icons/icon-192.svg" alt="GitBook">
    <h1 id="headline">PWA Transporter Connected</h1>
    <p id="subline">Tap Safari's Share icon &rarr; "Add to Home Screen" to install.</p>
  </div>

  <script>
    const target = 'https://gitbook.com';

    // Verify if the active wrapper is running inside standalone Home Screen layout metrics
    const isStandalone = window.navigator.standalone === true || 
                         window.matchMedia('(display-mode: standalone)').matches || 
                         window.matchMedia('(display-mode: minimal-ui)').matches;

    if (isStandalone) {
      // HOME SCREEN MODE: Instantly shift labels and execute immediate direct redirect
      document.getElementById('headline').textContent = "Opening GitBook…";
      document.getElementById('subline').innerHTML = 'If you are not redirected automatically, <a href="' + target + '">click here</a>.';
      
      // Inject Copilot's Native Hardware Debouncer directly into the launch window listener
      const DEBOUNCE_MS = 300;
      let lastSlashTime = 0;

      window.addEventListener('keydown', function (e) {
        if (e.key !== '/') return;
        if (e.isComposing || e.repeat) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return;
        }
        const now = Date.now();
        if (now - lastSlashTime < DEBOUNCE_MS) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return;
        }
        lastSlashTime = now;
      }, true);

      // Force an absolute context window break using _self to bypass cross-domain sandboxing
      window.open(target, '_self');
    } else {
      // BROWSER SAFARI MODE: The code halts here completely! 
      // It will never redirect, giving you infinite time to click the share buttons.
      console.log("Stalled in Safari Browser mode. Waiting for user to Add to Home Screen.");
    }

    // Initialize your background worker layer safely
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
      });
    }
  </script>
</body>
</html>
