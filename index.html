<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitBook Workspace Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        iframe { border: none; width: 100%; height: 100%; display: none; }
        
        /* Minimal layout shown only when inside regular Safari browser deployment mode */
        #safari-prompt { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; color: #1a1a1a; text-align: center; background: #ffffff; }
        .logo { width: 64px; height: 64px; margin-bottom: 16px; }
        .status-text { font-size: 18px; font-weight: 600; color: #24292e; margin-bottom: 4px; }
        .instruction-text { font-size: 14px; color: #586069; }
    </style>
</head>
<body>

    <!-- Static browser screen visible only during initial setup inside standard Safari -->
    <div id="safari-prompt">
        <img class="logo" src="https://gitbook.com" alt="GitBook">
        <div class="status-text">PWA Deployment Engine Ready</div>
        <div class="instruction-text">Tap Safari's Share icon → "Add to Home Screen" to install.</div>
    </div>

    <!-- The structural iframe container that encapsulates your working workspace coordinates -->
    <iframe id="gitbook-frame" src="https://app.gitbook.com/o/R7LSB5e7G7xlH369oTpt/home"></iframe>

    <script>
        const safariPrompt = document.getElementById('safari-prompt');
        const gitbookFrame = document.getElementById('gitbook-frame');

        // Identify if the application wrapper container is operating inside Standalone/Minimal-UI window metrics
        const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: minimal-ui)').matches;

        if (isStandalone) {
            // HOME SCREEN MODE: Instantly hide the prompt wrapper and launch your target working canvas URL
            safariPrompt.style.display = 'none';
            gitbookFrame.style.display = 'block';
        }

        // Initialize and register your Service Worker layer smoothly in the background
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration error:', err));
            });
        }
    </script>
</body>
</html>
