<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>GitBook Workspace Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icons/icon-192.svg" sizes="192x192" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    body,html{height:100%;margin:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .message{max-width:90%;text-align:center}
    .logo{width:64px;height:64px;margin-bottom:16px}
  </style>
</head>
<body>
  <div class="message">
    <img class="logo" src="icons/icon-192.svg" alt="GitBook">
    <h1>Opening GitBook…</h1>
    <p>If you are not redirected automatically, <a id="link" href="#">click here</a>.</p>
  </div>

  <script>
    // Redirect target provided by repository owner
    const target = 'https://app.gitbook.com/o/R7LSB5e7G7xlH369oTpt/home';
    // Update fallback link
    document.getElementById('link').href = target;

    // Try a fast client-side replacement so the installed PWA opens the real app
    try {
      // Use replace to avoid creating history entry for the shell
      window.location.replace(target);
    } catch (e) {
      // As a fallback, set location
      window.location.href = target;
    }
  </script>
</body>
</html>
